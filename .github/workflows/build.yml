
name: MysteryDrop Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir extracted
          unzip -o MysteryDrop_1.0.0.zip -d extracted
          find extracted -type f

      - name: Find Gradle project
        run: |
          BUILD_FILE=$(find extracted -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print -quit)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Gradle build file not found inside ZIP"
            exit 1
          fi

          BUILD_DIR=$(dirname "$BUILD_FILE")
          echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"
          echo "Found Gradle project: $BUILD_DIR"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: |
          cd "$BUILD_DIR"
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MysteryDrop-1.0.0
          path: extracted/**/build/libs/*.jar
          if-no-files-found: error
